# ISUCON11 予選 のチーム環境。公式と同じく、問題サーバー 3 台で構成する。
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
  TeamId:
    Type: String
  SshPublicKeys:
    Type: String
    NoEcho: true
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceType:
    Type: String
    Default: c5.large
Resources:
  Server1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroupId]
          AssociatePublicIpAddress: true
      Tags:
        - Key: Name
          Value: !Sub "isucon11-qualify-${TeamId}-1"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          # UserData の結果を WaitCondition に知らせる。スタックは、全サーバーの UserData が終わってから完了する。
          signal() {
            curl -sf -X PUT -H 'Content-Type:' --data-binary '{"Status":"'"$1"'","Reason":"UserData","UniqueId":"Server1","Data":""}' '${ReadyHandle}'
          }
          trap 'status=$?; [ "$status" -eq 0 ] || signal FAILURE' EXIT
          # AMI の isucon ユーザーは sudo できるが、SSH の鍵を持たない。
          install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
          cat > /home/isucon/.ssh/authorized_keys <<'KEYS'
          ${SshPublicKeys}
          KEYS
          chown isucon:isucon /home/isucon/.ssh/authorized_keys
          chmod 600 /home/isucon/.ssh/authorized_keys
          signal SUCCESS
  Server2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroupId]
          AssociatePublicIpAddress: true
      Tags:
        - Key: Name
          Value: !Sub "isucon11-qualify-${TeamId}-2"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          # UserData の結果を WaitCondition に知らせる。スタックは、全サーバーの UserData が終わってから完了する。
          signal() {
            curl -sf -X PUT -H 'Content-Type:' --data-binary '{"Status":"'"$1"'","Reason":"UserData","UniqueId":"Server2","Data":""}' '${ReadyHandle}'
          }
          trap 'status=$?; [ "$status" -eq 0 ] || signal FAILURE' EXIT
          # AMI の isucon ユーザーは sudo できるが、SSH の鍵を持たない。
          install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
          cat > /home/isucon/.ssh/authorized_keys <<'KEYS'
          ${SshPublicKeys}
          KEYS
          chown isucon:isucon /home/isucon/.ssh/authorized_keys
          chmod 600 /home/isucon/.ssh/authorized_keys
          signal SUCCESS
  Server3:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroupId]
          AssociatePublicIpAddress: true
      Tags:
        - Key: Name
          Value: !Sub "isucon11-qualify-${TeamId}-3"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          # UserData の結果を WaitCondition に知らせる。スタックは、全サーバーの UserData が終わってから完了する。
          signal() {
            curl -sf -X PUT -H 'Content-Type:' --data-binary '{"Status":"'"$1"'","Reason":"UserData","UniqueId":"Server3","Data":""}' '${ReadyHandle}'
          }
          trap 'status=$?; [ "$status" -eq 0 ] || signal FAILURE' EXIT
          # AMI の isucon ユーザーは sudo できるが、SSH の鍵を持たない。
          install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
          cat > /home/isucon/.ssh/authorized_keys <<'KEYS'
          ${SshPublicKeys}
          KEYS
          chown isucon:isucon /home/isucon/.ssh/authorized_keys
          chmod 600 /home/isucon/.ssh/authorized_keys
          signal SUCCESS
  ReadyHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
  Ready:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: [Server1, Server2, Server3]
    Properties:
      Handle: !Ref ReadyHandle
      Count: 3
      Timeout: "900"
