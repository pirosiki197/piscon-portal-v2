# ISUCON13 のチーム環境。公式と同じく、問題サーバー 3 台で構成する。
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
  TeamId:
    Type: String
  SshPublicKeys:
    Type: String
    NoEcho: true
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceType:
    Type: String
    Default: c5.large
Resources:
  Server1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroupId]
          AssociatePublicIpAddress: true
      Tags:
        - Key: Name
          Value: !Sub "isucon13-${TeamId}-1"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          # AMI の isucon ユーザーは sudo できるが、SSH の鍵を持たない。
          install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
          cat > /home/isucon/.ssh/authorized_keys <<'KEYS'
          ${SshPublicKeys}
          KEYS
          chown isucon:isucon /home/isucon/.ssh/authorized_keys
          chmod 600 /home/isucon/.ssh/authorized_keys
          # AMI の PowerDNS は u.isucon.local の名前を 127.0.0.1 で答える。runner は対象サーバーの DNS で名前を引くので、
          # このサーバーの private IP で答えるようにする。アプリも、新しいユーザーの名前を env.sh のアドレスで登録する。
          token=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
          private_ip=$(curl -sf -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/local-ipv4)
          sed -Ei 's/^ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS=.+$/ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS="'"$private_ip"'"/' /home/isucon/env.sh
          # PowerDNS が使う MySQL の起動を待つ。
          for _ in $(seq 60); do
            bash /home/isucon/webapp/pdns/init_zone.sh && break
            sleep 2
          done
          systemctl restart isupipe-go.service
