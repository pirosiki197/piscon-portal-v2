services:
  db:
    extends:
      file: compose.yaml
      service: db

  portal:
    extends:
      file: compose.yaml
      service: portal
    volumes:
      - ./.dev/instance:/app/.dev/instance
      - ~/.aws/config:/app/.aws/config:ro
      - ~/.aws/credentials:/app/.aws/credentials:ro
      - ${PROBLEM_BUNDLE_PATH:?PROBLEM_BUNDLE_PATH を .env に書いてください}:/bundle:ro

  runner:
    extends:
      file: compose.yaml
      service: runner

volumes:
  runner-logs:
